packages:
  - "apps/*"
  - "packages/*"
  - "services/bot-runner"
  - "services/ai-evals"
  - "services/quant"

onlyBuiltDependencies:
  - "@swc/core"
  - esbuild
  - "@nestjs/core"
  - sharp

ignoredBuiltDependencies:
  - "@scarf/scarf"
  - protobufjs

# Supply-chain hardening (goal 10, Semgrep pnpm rules): new versions must be seven days old before they
# can be resolved, trust evidence may not downgrade between versions, and transitive dependencies
# may not come from git/tarball URLs.
minimumReleaseAge: 10080
trustPolicy: no-downgrade
# Reviewed exceptions: old releases published before provenance existed, pulled in by the build
# toolchain (not a takeover signal). Add an entry only after checking the package on npm.
trustPolicyExclude:
  - semver@6.3.1
blockExoticSubdeps: true
