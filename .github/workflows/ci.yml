name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Goal 10: the release pipeline runs the full CI as its first stage.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  LIVE_TRADING_ENABLED: 'false'
  TURBO_TELEMETRY_DISABLED: '1'
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  node:
    name: lint · typecheck · unit · integration · build · e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: timescale/timescaledb:2.17.2-pg16
        env:
          POSTGRES_PASSWORD: postgres_ci_only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.pw-browsers
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: CI env (service-container ports)
        run: |
          cp .env.example .env
          sed -i 's/127.0.0.1:55432/127.0.0.1:5432/g; s/^KORA_PG_PORT=.*/KORA_PG_PORT=5432/; s/127.0.0.1:56379/127.0.0.1:6379/; s#^PLAYWRIGHT_BROWSERS_PATH=.*#PLAYWRIGHT_BROWSERS_PATH=${{ github.workspace }}/.pw-browsers#' .env
          node scripts/gen-dev-secrets.mjs .env
      - name: Bootstrap database roles
        run: |
          set -a; source .env; set +a
          PGHOST=127.0.0.1 PGPORT=5432 PGUSER=postgres PGPASSWORD=postgres_ci_only bash scripts/db-bootstrap.sh
      - name: Build
        run: pnpm build
      - name: Lint
        run: pnpm lint
      - name: Format (Prettier, whole repo)
        run: pnpm format:check
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests (TS + Python)
        run: pnpm test
      # IRTC R6-07: this is a regression test of the eval pipeline, the dispatcher guards and the
      # graders against a deterministic scripted provider. It says nothing about a real model's
      # quality or grounding; that is the `ai-evals-live` job below.
      - name: AI evals, scripted-provider regression (pipeline, guards and graders; not model quality)
        run: pnpm evals
      - name: Contrast check (both themes)
        run: pnpm contrast
      - name: Novice copy complete in EN and FR (goal 08, no missing keys)
        run: pnpm --filter @kora/web i18n:check
      - name: API integration tests (real Postgres + Redis, coverage floors enforced)
        run: pnpm --filter @kora/api test:integration
      - name: Playwright browsers
        run: pnpm --filter @kora/web exec playwright install --with-deps chromium
      - name: Storybook build
        run: pnpm --filter @kora/ui build-storybook
      - name: Storybook axe in Chromium (every story, both themes, contrast included)
        run: pnpm --filter @kora/ui test:storybook-axe
      - name: Playwright e2e
        run: pnpm test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  # IRTC R6-07: the real model against the same eval set and thresholds. It runs only when the
  # repository has the ANTHROPIC_API_KEY secret and the KORA_AI_MODEL variable (billed model chosen by
  # the Sponsor, OQ-A2); without them the job reports "skipped: no key" and passes. The release gate
  # requires a green run of this job once the key exists (RELEASE_CHECKLIST.md).
  ai-evals-live:
    name: AI evals, live model (gated on secrets)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      KORA_AI_MODEL: ${{ vars.KORA_AI_MODEL }}
    steps:
      - name: Key and model configured?
        id: gate
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ] && [ -n "$KORA_AI_MODEL" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; echo "skipped: no ANTHROPIC_API_KEY secret or KORA_AI_MODEL variable"; fi
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        if: steps.gate.outputs.run == 'true'
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        if: steps.gate.outputs.run == 'true'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        if: steps.gate.outputs.run == 'true'
        run: pnpm install --frozen-lockfile
      - name: Live evals (same cases and thresholds as the scripted run)
        if: steps.gate.outputs.run == 'true'
        run: KORA_ENV=test pnpm evals:live

  python:
    name: quant (py${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: ruff · mypy --strict · pytest
        run: PYTHON=python bash scripts/py-check.sh
      - name: pip-audit
        run: services/quant/.venv/bin/pip install pip-audit && services/quant/.venv/bin/pip-audit --skip-editable

  security:
    name: dependency audit · SAST · secrets · Trivy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - name: pnpm audit (prod, high+)
        run: pnpm audit --prod --audit-level high
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install Semgrep and detect-secrets
        run: pip install semgrep==1.178.0 detect-secrets==1.5.0
      - name: SAST (Semgrep registry rulesets + KORA rules, fail on any finding)
        run: bash scripts/security/sast.sh
      - name: Secrets scan of the whole git history
        run: python scripts/security/secrets-history.py
      - name: Trivy filesystem scan (deps, secrets, misconfig)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0 (the 0.28.0 tag no longer exists upstream)
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          skip-dirs: design,docs

  images:
    name: image build + Trivy (${{ matrix.image }})
    runs-on: ubuntu-24.04
    needs: [node]
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            dockerfile: apps/api/Dockerfile
            context: .
          - image: web
            dockerfile: apps/web/Dockerfile
            context: .
          - image: bot-runner
            dockerfile: services/bot-runner/Dockerfile
            context: .
          - image: quant
            dockerfile: services/quant/Dockerfile
            context: services/quant
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Build
        run: docker build -f ${{ matrix.dockerfile }} -t kora-${{ matrix.image }}:ci ${{ matrix.context }}
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0 (the 0.28.0 tag no longer exists upstream)
        with:
          image-ref: kora-${{ matrix.image }}:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
