# KORA deployment reference topology (ADR 0000). Not required for tests: dev/test use native
# Postgres + Redis via scripts/dev-db.sh. Usage from the repo root:
#   docker compose up -d          (root docker-compose.yml includes this file)
#   pnpm dev:apps
# All secrets come from the repo-root .env (see .env.example).
name: kora

services:
  postgres:
    image: timescale/timescaledb:2.17.2-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${KORA_PG_SUPERUSER_PASSWORD:?set in .env}
      POSTGRES_DB: postgres
      KORA_DB_OWNER_PASSWORD: ${KORA_DB_OWNER_PASSWORD:?set in .env}
      KORA_DB_APP_PASSWORD: ${KORA_DB_APP_PASSWORD:?set in .env}
      KORA_DB_AUDIT_READER_PASSWORD: ${KORA_DB_AUDIT_READER_PASSWORD:?set in .env}
      KORA_DATABASES: kora kora_test kora_e2e keycloak
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
      - ../scripts/db-bootstrap.sh:/kora/db-bootstrap.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    restart: unless-stopped
    command: ["start-dev", "--import-realm", "--health-enabled=true"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set in .env}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: kora_owner
      KC_DB_PASSWORD: ${KORA_DB_OWNER_PASSWORD}
      KC_HOSTNAME: http://localhost:8080
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:?set in .env}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
    ports: ["127.0.0.1:8080:8080"]
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    depends_on:
      postgres: { condition: service_healthy }

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.114.0
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes: [./otel/collector.yaml:/etc/otelcol/config.yaml:ro]
    ports:
      - "127.0.0.1:4317:4317" # OTLP gRPC
      - "127.0.0.1:4318:4318" # OTLP HTTP (set OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318)
      - "127.0.0.1:8889:8889" # Prometheus exporter

  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d"]
    volumes: [./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro, ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro]
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["127.0.0.1:9090:9090"]
    depends_on: [otel-collector]

  grafana:
    image: grafana/grafana:11.3.1
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes: [./grafana/provisioning:/etc/grafana/provisioning:ro]
    ports: ["127.0.0.1:3001:3000"]
    depends_on: [prometheus]

volumes:
  pgdata:
  redisdata:
