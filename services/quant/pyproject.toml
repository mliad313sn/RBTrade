[project]
name = "kora-quant"
version = "1.0.0rc1"
description = "KORA quant service: Monte Carlo projection, bootstrap, reality checks and paper analytics."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "pydantic>=2.9,<3",
  "numpy>=1.26,<3",
  "numba>=0.60,<1",
  # goal 10 observability: W3C trace context from the api/runner, spans to the collector (OTLP)
  "opentelemetry-api>=1.30,<2",
  "opentelemetry-sdk>=1.30,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "mypy>=1.13",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.8",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "bench"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "S", "A", "C4", "DTZ", "PT", "RET", "SIM", "RUF"]
ignore = []
# maths notation in docstrings and user-facing messages is intentional
allowed-confusables = ["×", "−", "–", "γ", "σ"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PT018"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["src", "tests", "bench"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=kora_quant --cov-report=term-missing --cov-fail-under=85"
